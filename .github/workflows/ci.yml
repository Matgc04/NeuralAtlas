name: CI

# Verifica que el sitio compile (lint + build) antes de mergear a main.
# Replica el build del deploy sin publicar nada, para detectar a tiempo
# cualquier cosa que rompería GitHub Pages.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: interpretability-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: interpretability-viewer

      - name: Lint
        run: npm run lint
        working-directory: interpretability-viewer

      - name: Build
        run: npm run build
        working-directory: interpretability-viewer
